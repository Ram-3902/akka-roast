<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>Akka Surf Excel Roast 😂</title>
<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.heart {
    position:absolute;
    color:rgba(255,0,100,0.5);
    font-size:20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}

.card {
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.3);
    max-width:400px;
    position:relative;
    z-index:10;
}

.akka-pic {
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    position:absolute;
    top:-61px;
    left:50%;
    transform:translateX(-50%);
    border:5px solid #ff69b4;
    box-shadow:0 0 20px hotpink;
}

h1 {
    color:#d81b60;
    margin-top:70px;
}

button {
    margin:15px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    background: linear-gradient(45deg, #ff4081, #f50057);
    color:white;
    box-shadow:0 8px 15px rgba(0,0,0,0.3);
}

.result {
    font-size:18px;
    margin-top:20px;
    color:#333;
}
</style>
</head>
<body>

<audio id="winSound">
  <source src="https://www.soundjay.com/buttons/sounds/button-09.mp3" type="audio/mpeg">
</audio>

<div class="card">
    <img src="akka.jpg" class="akka-pic" alt="My Cute Akka 😍">
    <h1>Ma Akka ?? 😏</h1>

    <button onclick="pichidi()">Pichidanivi 😂</button>
    <button onclick="manchidi()">Manchidanivi 😇</button>

    <div class="result" id="result"></div>
</div>

<script>
function pichidi() {
    document.getElementById("winSound").play();
    document.getElementById("result").innerHTML =
    "🎉 <b>Congratulations!</b><br>Meeru gelchukunnaru<br><b>Surf Excel ₹1</b> 😛😛😴😎🧼";
}

function manchidi() {
    document.getElementById("winSound").play();
    document.getElementById("result").innerHTML =
    "😌 Neeku antha scene led le...anu auntyy<br><b>nv pichidanive</b> 😂<br>Surf Excel ₹1 🧼";
}

// Floating hearts
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 6000);
}, 400);
</script>

</body>
</html>
